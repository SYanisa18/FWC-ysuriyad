<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 30px 15px;
            font-family: sans-serif;
        }
        .first-cell {
            background-color: #b5c476;
            width: 50%;
        }
        .second-cell {
            background-color: #f7beab;
            width: 50%;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-cell">green green</td>
            <td class="second-cell">red red</td>
        </tr>
    </table>
</body>
</html>
