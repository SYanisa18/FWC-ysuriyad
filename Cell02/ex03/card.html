<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <h1>User Profile Card</h1>
    <div class="profile-card">
        <table class="invisible-table">
            <tr>
                <td class="image-cell">
                    <img src="akutagawa.jpg" alt="Profile Picture" class="full-width-img">
                </td>
            </tr>
            <tr>
                <td align="center">
                    <h2 class="profile-login">Yanisa</h2>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <p class="profile-bio">Student / Developer</p>
                    <p class="sub-bio">bye bye my blue</p>
                </td>
            </tr>
            <tr>
                <td align="center">
                    <div class="social-icons">
                        <a href="#"><img src="Discord.jfif" alt="Discord"></a>
                        <a href="#"><img src="Facebook.jfif" alt="Facebook"></a>
                        <a href="#"><img src="Twitter.jfif" alt="Twitter"></a>
                        <a href="#"><img src="Instagram.jfif" alt="Instagram"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="button-cell">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </div>

    </div>
</body>
</html>
